name: Initial Infrastructure & Project Deploy

on:
  workflow_dispatch:
    inputs:
      project_slug:
        description: Project slug to deploy
        required: true
        type: string
      generated_image_tag:
        description: Docker image tag for this deploy (e.g. gen-1)
        required: true
        type: string
      branch:
        description: Branch to deploy
        required: false
        default: main
        type: string
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - Trooper
          - macmini

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.TAG }}
      repo_lower: ${{ steps.repo.outputs.REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set lowercase owner
        id: repo
        run: echo "REPO=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate tag
        id: vars
        run: |
          echo "TAG=${{ inputs.generated_image_tag }}" >> $GITHUB_OUTPUT

      - name: Clone project repo
        run: |
          git clone --branch "${{ inputs.branch }}" \
            "https://github.com/${{ github.repository_owner }}/${{ inputs.project_slug }}.git" \
            ./project

      - name: Build & Push platform image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=platform \
            --cache-to=type=gha,mode=max,scope=platform \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-platform:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-platform:latest \
            --push \
            ./project

      - name: Build & Push background-worker image
        run: |
          docker buildx build \
            --cache-from=type=gha,scope=worker \
            --cache-to=type=gha,mode=max,scope=worker \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-background-worker:${{ steps.vars.outputs.TAG }} \
            -t ghcr.io/${{ steps.repo.outputs.REPO }}/${{ inputs.project_slug }}-background-worker:latest \
            --push \
            ./project

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      port: ${{ steps.target.outputs.port }}
      upstream: ${{ steps.target.outputs.upstream }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ".github/scripts/*"
          target: "/tmp/v7ai-scripts"
          strip_components: 2

      - name: Deploy Infrastructure & Green Container (app machine)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_JWT_PRIVATE_KEY: ${{ secrets.APP_JWT_PRIVATE_KEY }}
          APP_JWT_PUBLIC_KEY: ${{ secrets.APP_JWT_PUBLIC_KEY }}
          APP_BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.APP_BOOTSTRAP_ADMIN_EMAIL }}
          APP_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.APP_BOOTSTRAP_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          envs: APP_JWT_PRIVATE_KEY,APP_JWT_PUBLIC_KEY,APP_BOOTSTRAP_ADMIN_EMAIL,APP_BOOTSTRAP_ADMIN_PASSWORD
          script: |
            set -e
            export PATH="/home/v7aisolution/.nvm/versions/node/v24.14.0/bin:$PATH"

            SCRIPTS="/tmp/v7ai-scripts"
            chmod +x "$SCRIPTS"/*.sh

            PROJECT_SLUG="${{ inputs.project_slug }}"
            BRANCH="${{ inputs.branch }}"
            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
            REPO="${{ needs.build.outputs.repo_lower }}"

            DEPLOY_DIR="/home/deploy/vyapti/generated-projects/${PROJECT_SLUG}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── 1. Prepare environment & assign ports ──────────────────
            APP_PORT=$("$SCRIPTS/prepare-deploy.sh" \
              "$PROJECT_SLUG" \
              "$DEPLOY_DIR" \
              "${{ github.repository_owner }}" \
              "$SCRIPTS" \
              "$BRANCH")

            # ── 2. Start infrastructure (Postgres, Redis, MinIO) ──────
            cd "$DEPLOY_DIR"
            docker compose --env-file "$DEPLOY_DIR/.env.ports" up -d postgres redis minio minio-init

            # ── 3. Deploy backend as Green + Health Check + DB Migration ─
            "$SCRIPTS/deploy-green.sh" \
              "$PROJECT_SLUG" \
              "$REPO" \
              "$IMAGE_TAG" \
              "$SCRIPTS"

      # ── Runner: which IP:port must nginx proxy to? ───────────────────────
      - name: Resolve green port & upstream host
        id: target
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.VM_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          PROJECT_SLUG: ${{ inputs.project_slug }}
          TARGET_PORT: ""
          UPSTREAM_HOST: ${{ vars.UPSTREAM_HOST }}
          MACHINE: ${{ inputs.environment }}
          NGINX_MACHINE: ${{ vars.NGINX_MACHINE || 'Trooper' }}
        run: bash .github/ci/resolve-target.sh

  # ── NGINX machine: takes the nginx environment's own SSH creds from its environment ──
  nginx:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ vars.NGINX_MACHINE || 'Trooper' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy nginx script to nginx machine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ".github/scripts/setup-nginx.sh"
          target: "/tmp/v7ai-nginx"
          strip_components: 2

      - name: Switch nginx traffic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            chmod +x /tmp/v7ai-nginx/setup-nginx.sh
            /tmp/v7ai-nginx/setup-nginx.sh \
              "${{ inputs.project_slug }}" \
              "${{ needs.deploy.outputs.port }}" \
              "${{ needs.deploy.outputs.upstream }}"

  # ── App machine again: old blue out, green becomes blue ──────────────────
  promote:
    needs: [deploy, nginx]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Promote green to blue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            chmod +x /tmp/v7ai-scripts/*.sh
            /tmp/v7ai-scripts/promote-green.sh "${{ inputs.project_slug }}"
